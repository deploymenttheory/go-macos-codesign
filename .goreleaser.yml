version: 2
project_name: macoscodesign

before:
  hooks:
    - go mod download

builds:
  - id: macoscodesign
    main: ./cmd/macoscodesign
    binary: macoscodesign
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - README.md
      - src: third_party/licenses/*
        dst: licenses
        strip_parent: true
      - src: third_party/afero/LICENSE.txt
        dst: licenses/afero.txt
        strip_parent: true
      - src: third_party/rc2/LICENSE
        dst: licenses/rc2.txt
        strip_parent: true

checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_checksums.txt'
  algorithm: sha256

sboms:
  - artifacts: archive
    documents:
      - '${artifact}.sbom.spdx.json'

signs:
  - cmd: cosign
    signature: '${artifact}.sigstore.json'
    args:
      - sign-blob
      - '--bundle=${signature}'
      - '${artifact}'
      - '--yes'
    artifacts: checksum
    output: true

snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  # Release Please owns the changelog and release notes.
  disable: true

release:
  mode: append
  footer: |
    ---

    Binaries are pure Go and require no macOS runtime dependencies.
    Supported features and remaining gaps are recorded in the
    [compatibility inventory](https://github.com/deploymenttheory/go-macos-codesign/blob/{{ .Tag }}/docs/compatibility.md).

    Verify the checksum file's workflow identity, then check the archive hashes:

    ```console
    cosign verify-blob \
      --bundle macoscodesign_{{ .Version }}_checksums.txt.sigstore.json \
      --certificate-identity 'https://github.com/deploymenttheory/go-macos-codesign/.github/workflows/release.yml@refs/tags/{{ .Tag }}' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      macoscodesign_{{ .Version }}_checksums.txt

    shasum -a 256 -c macoscodesign_{{ .Version }}_checksums.txt --ignore-missing
    ```
